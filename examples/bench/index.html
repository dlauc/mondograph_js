<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mondograph benchmark</title>
<style>
  :root { --mg-background: #fbfaf8; }
  html, body { margin: 0; height: 100%; background: #fbfaf8; font: 13px/1.4 system-ui, sans-serif; }
  #graph { position: absolute; inset: 0 0 64px 0; }
  #out { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; overflow: auto; padding: 4px 8px; white-space: pre; }
</style>
</head>
<body>
<div id="graph"></div>
<div id="out">Running…  (add ?manual to skip the automatic run)</div>
<script type="module">
// The E1 performance gate (plan §8): 400 nodes, 800 edges, labels, hulls,
// chips, edge hit-testing and the DOM mirror, all at once.
import { MondoGraph, hashString } from '../../dist/mondograph.esm.js';

const params = new URLSearchParams(location.search);
const N = Number(params.get('nodes') ?? 400);
const E = Number(params.get('edges') ?? 800);
const perf = {};
if (params.has('maxDpr')) perf.maxDpr = Number(params.get('maxDpr'));
if (params.has('shadowMaxNodes')) perf.shadowMaxNodes = Number(params.get('shadowMaxNodes'));
if (params.has('hullQuantum')) perf.hullQuantum = Number(params.get('hullQuantum'));

// deterministic PRNG
let seed = 12345;
const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
const SYL = ['an', 'va', 'ri', 'jo', 'ma', 'el', 'ka', 'to', 'mi', 'ra', 'do', 'sa', 'li', 'ne', 'go', 'hi', 'ro', 'shi', 'mu', 'ha', 'med', 'fried', 'rich', 'slav'];
const name = (i) => { let s = ''; const k = 2 + (hashString('n' + i) % 3); for (let j = 0; j < k; j++) s += SYL[hashString(i + ':' + j) % SYL.length]; return s[0].toUpperCase() + s.slice(1); };
const FAMS = ['F2', 'F3', 'F4', 'F5', 'F6', 'F7', 'F8', 'F9'];
const PROV = ['recorded', 'recorded', 'recorded', 'modelled', 'community', 'unknown'];
const LANGS = ['hrv', 'srp', 'eng', 'deu', 'spa', 'ita', 'fra', 'ara', 'jpn', 'rus'];

function build() {
  const nodes = [{ id: 'n0', label: 'Radovan', lang: 'hrv', popularity: 1, chips: [
    { id: 'c0a', label: 'Радован', assertionId: 'a0a' }, { id: 'c0b', label: 'Radowan', assertionId: 'a0b' },
    { id: 'c0c', label: 'Ραντοβαν', assertionId: 'a0c' }, { id: 'c0d', label: 'ラドヴァン', assertionId: 'a0d' }, { id: 'c0e', label: 'Radovane', assertionId: 'a0e' }] }];
  const edges = [];
  for (let i = 1; i < N; i++) {
    const fam = FAMS[i % FAMS.length];
    const n = { id: 'n' + i, label: name(i), lang: LANGS[i % LANGS.length], popularity: rnd(), family: fam, ring: 1 + (i % 3) };
    if (i % 4 === 0) n.chips = Array.from({ length: 2 + (i % 5) }, (_, k) => ({ id: `c${i}-${k}`, label: name(i * 7 + k), assertionId: `a${i}-${k}`, status: k === 1 && i % 8 === 0 ? 'disputed' : 'open' }));
    nodes.push(n);
    // tree edge: ring-1 nodes hang off the centre, others off an earlier node in the same family
    const parent = n.ring === 1 ? 0 : Math.max(0, i - FAMS.length * (1 + (i % 2)));
    edges.push(mkEdge(edges.length, 'n' + parent, n.id, fam));
  }
  while (edges.length < E) {
    const a = Math.floor(rnd() * N), b = Math.floor(rnd() * N);
    if (a === b) continue;
    edges.push(mkEdge(edges.length, 'n' + a, 'n' + b, FAMS[(a + b) % FAMS.length]));
  }
  const groups = [];
  for (let g = 0; g < 8; g++) {
    const members = [];
    for (let i = 1 + g; i < N; i += 8) if (members.length < 22 && (i % 3) !== 0) members.push('n' + i);
    groups.push({ id: 'g' + g, label: ['Slavic', 'Germanic', 'Romance', 'Semitic', 'Japonic', 'Greek', 'Celtic', 'Turkic'][g], members });
  }
  return { nodes, edges, groups };
}
function mkEdge(i, from, to, family) {
  return {
    id: 'e' + i, from, to, family, assertionId: 'as' + i,
    provenance: PROV[i % PROV.length],
    status: i % 29 === 3 ? 'disputed' : (i % 31 === 4 ? 'suppressed' : 'open'),
    certainty: i % 13 === 2 ? 'uncertain' : 'some',
    directed: family === 'F5' || family === 'F8',
    label: `link ${i}`,
  };
}

const data = build();
const frames = [];
const graph = new MondoGraph({
  container: document.getElementById('graph'),
  theme: 'editorialLight',
  layout: 'sectors',
  layoutOptions: { sectorOrder: FAMS },
  reducedMotion: params.has('reduced') ? true : 'auto',
  onFrame: (f) => frames.push(f.drawMs),
  perf,
});
window.graph = graph;
graph.setData(data, 'n0');

const raf = () => new Promise(r => requestAnimationFrame(r));
const stats = (arr) => {
  const s = arr.slice().sort((a, b) => a - b);
  const q = (p) => s[Math.min(s.length - 1, Math.floor(p * s.length))];
  const mean = s.reduce((a, b) => a + b, 0) / Math.max(1, s.length);
  return { n: s.length, mean: +mean.toFixed(2), p50: +q(0.5).toFixed(2), p95: +q(0.95).toFixed(2), max: +s[s.length - 1].toFixed(2) };
};

// Wait until the springs have come to rest (physics is per frame, so a throttled
// CPU needs more wall time), at least `ms`, at most 15 s.
async function settle(ms = 500) {
  const t = performance.now();
  let still = 0;
  while (performance.now() - t < 15000) {
    await raf();
    still = graph.renderer._movingNow ? 0 : still + 1;
    if (still >= 5 && performance.now() - t >= ms) break;
  }
}

// Drag-pan with real pointer events (what a finger does), or a hover sweep
// (pointer moving without a button: chip, node and edge hit-tests every frame).
async function gesture(seconds, mode) {
  const canvas = graph.renderer.canvas;
  const rect = canvas.getBoundingClientRect();
  const intervals = [];
  frames.length = 0;
  const ev = (type, x, y, buttons) => canvas.dispatchEvent(new PointerEvent(type, {
    clientX: x, clientY: y, buttons, bubbles: true, pointerId: 7, pointerType: mode === 'drag' ? 'touch' : 'mouse', isPrimary: true }));
  let px = rect.left + rect.width / 2, py = rect.top + rect.height / 2;
  if (mode === 'drag') ev('pointerdown', px, py, 1);
  let last = await raf();
  const t0 = last;
  let k = 0;
  while (last - t0 < seconds * 1000) {
    const a = k * 0.05;
    if (mode === 'drag') {
      px += Math.cos(a) * 4; py += Math.sin(a) * 4;
      ev('pointermove', px, py, 1);
    } else {
      const x = rect.left + rect.width / 2 + Math.cos(a * 1.7) * rect.width * 0.4;
      const y = rect.top + rect.height / 2 + Math.sin(a * 1.3) * rect.height * 0.4;
      ev('pointermove', x, y, 0);
    }
    const now = await raf();
    intervals.push(now - last);
    last = now;
    k++;
  }
  if (mode === 'drag') ev('pointerup', px, py, 0);
  graph.resetView();
  const iv = stats(intervals);
  return { frameInterval: iv, fps: +(1000 / iv.mean).toFixed(1), drawMs: stats(frames.length ? frames : [0]) };
}

// Every frame fully redrawn (no cached layer): the cost of an animating scene.
async function fullRedraw(seconds = 3) {
  const r = graph.renderer;
  r.perf.layerCache = false;
  const res = await gesture(seconds, 'drag');
  r.perf.layerCache = true;
  return res;
}

async function recentre(times = 8) {
  const sync = [], firstFrame = [], anim = [], animDraw = [];
  const ids = ['n9', 'n17', 'n0', 'n33', 'n0', 'n61', 'n2', 'n0'].slice(0, times);
  for (const id of ids) {
    frames.length = 0;
    const t0 = performance.now();
    await graph.setCenter(id);
    const t1 = performance.now();
    await raf(); await raf();          // the frame that paints the new layout
    const t2 = performance.now();
    sync.push(t1 - t0);
    firstFrame.push(t2 - t0);
    // frame pacing while the springs carry the scene to its new places (first second)
    let last = t2;
    while (performance.now() - t2 < 1000) { const now = await raf(); anim.push(now - last); last = now; }
    animDraw.push(...frames);
    await settle(300);
  }
  const a = stats(anim);
  return { syncMs: stats(sync), toPaintMs: stats(firstFrame), animation: { frameInterval: a, fps: +(1000 / a.mean).toFixed(1), drawMs: stats(animDraw) } };
}

async function hitTestCost(n = 2000) {
  const r = graph.renderer;
  const t0 = performance.now();
  for (let i = 0; i < n; i++) graph.pick((i * 37) % r.W, (i * 53) % r.H);
  return +((performance.now() - t0) / n).toFixed(4);
}

async function run() {
  const r = graph.renderer;
  const info = { nodes: graph.getScene().nodes.length, edges: graph.getScene().edges.length, groups: data.groups.length,
    chips: data.nodes.reduce((s, n) => s + (n.chips?.length ?? 0), 0),
    mirrorButtons: document.querySelectorAll('.mg-a11y button').length,
    viewport: `${innerWidth}x${innerHeight}@${devicePixelRatio}`, canvasPx: `${r.canvas.width}x${r.canvas.height}`,
    reducedMotion: r.reducedMotion, shadows: !(r.nodes.length > r.perf.shadowMaxNodes), ua: navigator.userAgent };
  await settle();
  const builds0 = graph.renderer.layerBuilds ?? 0;
  const panning = await gesture(4, 'drag');
  const hover = await gesture(3, 'hover');
  const layerBuilds = (graph.renderer.layerBuilds ?? 0) - builds0;
  const full = await fullRedraw(3);
  graph.zoomTo(0.45);
  await settle(300);
  const panLowZoom = await gesture(3, 'drag');
  graph.resetView();
  await settle(300);
  const re = await recentre();
  const pickMs = await hitTestCost();
  const res = { info, panning, hover, fullRedraw: full, panLowZoom, layerBuilds, recentre: re, pickMs };
  document.getElementById('out').textContent = JSON.stringify({ panFps: panning.fps, hoverFps: hover.fps, animFps: re.animation.fps, recentreSync: re.syncMs.mean, toPaint: re.toPaintMs.mean, pickMs });
  return res;
}
window.__bench = run;
if (!params.has('manual')) run().then(r => { window.__benchResult = r; console.log(JSON.stringify(r)); });
</script>
</body>
</html>
